services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-bot-tarot:latest
    container_name: tarot_ai_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./bot.db:/app/bot.db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
