services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-bot-tarot:latest
    container_name: tarot_ai_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///app/data/bot.db?mode=rwc
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
