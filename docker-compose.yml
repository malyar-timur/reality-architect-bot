version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: tarot_ai_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
